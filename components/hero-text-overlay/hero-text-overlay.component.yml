$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero Text Overlay
status: stable
description: Text/HTML overlay positioned within a hero region whose background is supplied externally.

props:
  type: object
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
    overlay_position:
      type: string
      enum: [top-left, top-center, top-right, center-left, center, center-right, bottom-left, bottom-center, bottom-right]
      default: bottom-left
    height:
      type: string
      enum: [auto, small, medium, large, fullscreen]
      default: medium
    variant:
      type: string
      enum: [default, dark, light, scrim-dark, scrim-light]
      default: default
    heading_level:
      type: integer
      minimum: 2
      maximum: 6
      default: 2
    max_width:
      type: string
      title: Maximum width of the text box
      description: 'A CSS length such as 40rem, 600px or 60%. Anything else is ignored.'
      default: ""
    wrap_title:
      type: boolean
      default: true

slots:
  title: { title: Title, required: false }
  subtitle: { title: Subtitle, required: false }
  content: { title: Main body HTML, required: false }
  cta_primary: { title: Primary CTA, required: false }
  cta_secondary: { title: Secondary CTA, required: false }

global-styling:
  css:
    theme:
      css/style.css: {}
      https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css: { type: external, minified: true, weight: -100, preprocess: false }

components:
  css:
    theme:
      css/components/carousel.css: {}
      css/components/tags.css: {}
      css/components/site-header.css: {}
      css/components/listing.css: {}
      css/components/ghost-autocomplete.css: {}

header-height:
  js:
    js/header-height.js: {}
  dependencies:
    - core/drupal
    - core/once

bootstrap-js:
  js:
    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js: { type: external, minified: true }
  dependencies:
    # This jQuery dependency is often required by some Bootstrap components.
    # We will include it here for maximum compatibility and remove it later if necessary.
    - core/jquery

carousel:
  js:
    js/bootstrap-carousel.js: {}

fontawesome:
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css: { type: external }
      https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css: { type: external }

modal-forms:
  js:
    js/tclogin.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupal.ajax

ghost-autocomplete:
    js:
      js/ghost-autocomplete.js: {}

hero-parallax:
      js:
        js/parallax.js: {}

taxonomy-menu:
        js:
          js/taxonomy-menu-reparent.js: {}
        dependencies:
          - townscanada/bootstrap-js

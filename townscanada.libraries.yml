global-styling:
  css:
    theme:
      # Bootstrap 5 itself. See CHANGES.md: check the base theme does not
      # also load Bootstrap before removing either copy.
      https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css: { type: external, minified: true, weight: -100, preprocess: false }
      # Inter web font (was an @import inside style.css, which blocks
      # rendering and cannot be aggregated).
      'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap': { type: external, weight: -90 }
      css/style.css: {}

components:
  css:
    theme:
      css/components/carousel.css: {}
      css/components/tags.css: {}
      css/components/site-header.css: {}
      css/components/listing.css: {}
      css/components/ghost-autocomplete.css: {}

header-height:
  js:
    js/header-height.js: {}
  dependencies:
    - core/drupal
    - core/once

bootstrap-js:
  js:
    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js: { type: external, minified: true }
  # Bootstrap 5 does not need jQuery, so it is no longer forced onto every
  # page. Libraries that do need it (core/drupal.ajax, autocomplete) declare
  # it themselves.

carousel:
  js:
    js/bootstrap-carousel.js: {}
  dependencies:
    - core/drupal
    - core/once
    - townscanada/bootstrap-js

fontawesome:
  css:
    theme:
      # Font Awesome is still needed: style.css and listing.css draw field
      # icons with Font Awesome glyphs in ::before. Line Awesome is used for
      # the icons in templates.
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css: { type: external, minified: true }
      https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css: { type: external, minified: true }

modal-forms:
  js:
    js/tclogin.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupal.ajax
    - townscanada/bootstrap-js

ghost-autocomplete:
  js:
    js/ghost-autocomplete.js: {}
  dependencies:
    - core/drupal
    - core/drupal.debounce
    - core/once

hero-parallax:
  js:
    js/parallax.js: {}

taxonomy-menu:
  js:
    js/taxonomy-menu-reparent.js: {}
  dependencies:
    - townscanada/bootstrap-js
